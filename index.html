          var _currentFetch = _origFetch;
          var desc = {
            configurable: true,
            enumerable: true,
            get: function() {
              return _currentFetch;
            },
            set: function(fn) {
              _currentFetch = fn;
            }
          };
          try {
            Object.defineProperty(window, 'fetch', desc);
          } catch (e) {}
          if (typeof Window !== 'undefined' && Window.prototype) {
            try {
              Object.defineProperty(Window.prototype, 'fetch', desc);
            } catch (e) {}
          }
        } catch (e) {}
      })();
